<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mutumanikam</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f5f1eb;
}

/* HEADER */
header {
    background: #6b4f3b;
    color: white;
    text-align: center;
    padding: 15px;
}

/* MENU */
nav {
    background: #8a6a50;
    padding: 10px;
}
nav ul {
    display: flex;
    justify-content: center;
    gap: 20px;
    list-style: none;
    margin: 0;
    padding: 0;
}
nav a {
    color: white;
    text-decoration: none;
    font-weight: bold;
}

/* FILTER KATEGORI */
.filter {
    display: flex;
    gap: 10px;
    padding: 10px;
    overflow-x: auto;
}
.filter button {
    border: none;
    padding: 8px 12px;
    border-radius: 20px;
    background: #ddd;
    cursor: pointer;
}
.filter button.active {
    background: #6b4f3b;
    color: white;
}

/* GRID PRODUK */
.container {
    padding: 10px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

@media (min-width: 768px) {
    .container {
        grid-template-columns: repeat(3, 1fr);
    }
}

/* CARD PRODUK */
.product {
    background: white;
    border-radius: 10px;
    padding: 10px;
    position: relative;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

/* BADGE */
.badge {
    position: absolute;
    top: 10px;
    left: 10px;
    background: red;
    color: white;
    font-size: 10px;
    padding: 3px 6px;
    border-radius: 5px;
}

/* IMAGE */
.product img {
    width: 100%;
    height: 140px;
    object-fit: cover;
    border-radius: 8px;
}

/* TEXT */
.product h3 {
    font-size: 13px;
    margin: 5px 0;
}

/* HARGA */
.old-price {
    text-decoration: line-through;
    color: gray;
    font-size: 12px;
}
.price {
    color: #6b4f3b;
    font-weight: bold;
}

/* BUTTON */
button.buy {
    background: #25D366;
    color: white;
    border: none;
    padding: 8px;
    width: 100%;
    border-radius: 6px;
    margin-top: 5px;
    cursor: pointer;
}

/* FOOTER */
footer {
    text-align: center;
    padding: 10px;
    background: #ddd;
}
</style>
</head>

<body>

<header>
    <h1>Mutumanikam</h1>
    <p>Simple Beauty, Precious Value</p>
</header>

<nav>
<ul>
<li><a href="#">Home</a></li>
<li><a href="#">Produk</a></li>
<li><a href="#">Kontak</a></li>
</ul>
</nav>

<!-- FILTER -->
<div class="filter">
<button onclick="filterProduct('all')">Semua</button>
<button onclick="filterProduct('kalung')">Necklace</button>
<button onclick="filterProduct('gelang')">Bracelet</button>
<button onclick="filterProduct('tas')">Purse</button>
<button onclick="filterProduct('sabuk')">Belt</button>
</div>

<!-- PRODUK -->
<div class="container">

<div class="product" data-category="kalung">
<span class="badge">BEST SELLER</span>
<a href="necklace-crystal.jpg" target="_blank">
  <img src="necklace-crystal.jpg"alt="necklace-crystal">
</a>
<h3>Necklace Crystal</h3>
<div class="old-price">Rp70.000</div>
<div class="price">Rp55.000</div>
<button class="buy" onclick="openCheckout('Necklace Crystal Rp55.000')">Beli via WA</button>
</div>

<div class="product" data-category="sabuk">
<a href="bl-01.jpg" target="_blank">
  <img src="bl-01.jpg" alt="bl-01">
</a>
<h3>Belt Elastic 6/o Diamond w Buckle</h3>
<div class="price">Rp60.000</div>
<button class="buy" onclick="openCheckout('Belt Elastic 6/o Diamond w Buckle Rp60.000')">Beli via WA</button>
</div>

<div class="product" data-category="tas">
<a href="purse-10x14cm.jpg" target="_blank">
  <img src="purse-10x14cm.jpg" alt=purse-10x14cm">
</a>
<h3>Purse 10x14cm</h3>
<div class="old-price">Rp60.000</div>
<button class="buy" onclick="openCheckout('Purse Rp45.000')">Beli via WA</button>
</div>
    
<div class="product" data-category="gelang">
<a href="bracelet-lynda.jpg" target="_blank">
<img src="bracelet-lynda.jpg" alt="bracelet-lynda">
</a>
<h3>Bracelet Lynda</h3>
<div class="price">Rp33.000</div>
<button class="buy" onclick="openCheckout('Bracelet Lynda Rp33.000')">Beli via WA</button>
</div>

<div class="product" data-category="gelang">
<a href="bracelet-kalista-smalls.jpg" target="_blank">
  <img src="bracelet-kalista-smalls.jpg" alt="bracelet-kalista-smalls">
</a>
<h3>Bracelet Kalista Smalls</h3>
<div class="price">Rp33.000</div>
<button class="buy" onclick="openCheckout('Bracelet Kalista Smalls Rp33.000')">Beli via WA</button>

</div>

</div> <!-- penutup container -->

<footer>
<p>&copy; 2026 Mutumanikam</p>
</footer>


<div id="checkoutModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5);">

  <div style="background:white; padding:20px; margin:50px auto; width:90%; max-width:400px; border-radius:10px;">
    
    <h3>Checkout</h3>

    <input type="text" id="name" placeholder="Name">
    <input type="text" id="address" placeholder="Address">
    <input type="number" id="qty" placeholder="Qty">

    <button onclick="kirimWA()">Kirim via WhatsApp</button>
    <button onclick="closeModal()">Tutup</button>

  </div>
</div>


<script>
function filterProduct(category) {
  let products = document.querySelectorAll('.product');
  
  products.forEach(product => {
    if (category === 'all' || product.getAttribute('data-category') === category) {
      product.style.display = 'block';
    } else {
      product.style.display = 'none';
    }
  });
}
    
let selectedProduct = "";
function closeModal() {
document.getElementById("checkoutModal").style.display ="none";
}
function openCheckout(product) {
    selectedProduct = product;
    let modal = 
document.getElementById("checkoutModal");
    if (modal) { modal.style.display = 
"block";
  }
}

function kirimWA() {
    let name = document.getElementById("name").value;
    let address = document.getElementById("address").value;
    let qty = document.getElementById("qty").value;

    if (!name || !address || !qty) {
        alert("Harap isi semua data dulu!");
        return;
    }

    let phone = "6281353885122";

    let message = `Halo Admin Mutumanikam,

Saya mau order:

Nama: ${name}
Alamat: ${address}
Produk: ${selectedProduct}
Jumlah: ${qty}`;

    let url = "https://wa.me/" + phone + "?text=" + encodeURIComponent(message);
    window.open(url, "_blank");
}
</script>

</body>
</html>
